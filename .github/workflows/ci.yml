name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      WGT_ILLUMINATION_ROOT: ${{ github.workspace }}\.providers\illumination

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out pinned Illumination provider
        uses: actions/checkout@v4
        with:
          repository: wgt-system/illumination
          ref: 2e21c04e8741cfc5b120d7b6f0dfd6595b948907
          path: .providers/illumination

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WiiiiGotThis.sln

      - name: Build
        run: dotnet build WiiiiGotThis.sln --no-restore

      - name: Test
        run: dotnet test WiiiiGotThis.sln --no-build

      - name: Audit vulnerable packages
        shell: pwsh
        run: |
          $report = dotnet list WiiiiGotThis.sln package --vulnerable --include-transitive 2>&1
          $report | Write-Output
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($report -match 'has the following vulnerable packages') {
            throw 'Vulnerable NuGet packages were reported.'
          }
