name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WiiiiGotThis.sln

      - name: Build
        run: dotnet build WiiiiGotThis.sln --no-restore

      - name: Test
        run: dotnet test WiiiiGotThis.sln --no-build

      - name: Audit vulnerable packages
        shell: pwsh
        run: |
          $report = dotnet list WiiiiGotThis.sln package --vulnerable --include-transitive 2>&1
          $report | Write-Output
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($report -match 'has the following vulnerable packages') {
            throw 'Vulnerable NuGet packages were reported.'
          }

  ios-compile:
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10.0.302
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Verify Apple toolchain
        run: |
          dotnet --version
          xcodebuild -version

      - name: Install .NET iOS workload
        run: dotnet workload install ios --version 10.0.302.0

      - name: Restore iOS simulator target
        run: dotnet restore src/WiiiiGotThis.iOS/WiiiiGotThis.iOS.csproj -p:BuildiOS=true -p:RuntimeIdentifier=iossimulator-arm64 -p:ApplicationId=dev.wgtsystem.wiiiigotthis.ci

      - name: Compile iOS simulator target
        shell: bash
        run: |
          set -o pipefail
          dotnet build src/WiiiiGotThis.iOS/WiiiiGotThis.iOS.csproj -c Release --no-restore -p:BuildiOS=true -p:RuntimeIdentifier=iossimulator-arm64 -p:ApplicationId=dev.wgtsystem.wiiiigotthis.ci 2>&1 | tee ios-build.log

      - name: Reject unexpected iOS linker warnings
        shell: bash
        run: |
          linker_warnings="$(grep -E 'warning IL[0-9]+' ios-build.log || true)"
          unexpected="$(printf '%s\n' "$linker_warnings" | grep -v -E '^$|Avalonia\.DesignerSupport\.dll .*warning IL2104:' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected iOS linker warnings:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
